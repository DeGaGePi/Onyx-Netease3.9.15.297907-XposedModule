# ★ 本机物理内存只有 7.9G，且常驻 IDA / 游戏，实测极易被压到 91% 负载（仅剩 ~600MB）。
#   原来的 -Xmx2048m 默认用 G1，G1 启动时要 mmap 一大块连续虚拟空间 →
#   "Native memory allocation (mmap) failed to map 130023424 bytes for G1 virtual space"
#   (errno 1455 ERROR_COMMITMENT_LIMIT)。
#   本工程只有 10 个 java 文件、零依赖 → 小堆 + SerialGC 足够，且不吃连续大块内存。
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=128m -XX:+UseSerialGC -Dfile.encoding=UTF-8
# ★ AGP 要 Java 11+，但本机 JAVA_HOME 指向 D:\JDK（Java 8）→ 必须显式钉死 JDK 17，
#   否则 release 构建会报 "Android Gradle plugin requires Java 11 to run"
org.gradle.java.home=C:\\Program Files\\Java\\jdk-17
android.useAndroidX=false
android.overridePathCheck=true
android.nonTransitiveRClass=true
